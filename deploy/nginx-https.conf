server {
    listen 80;
    server_name event.siping.me;
    location ^~ /.well-known/acme-challenge/ { root /var/www/eventplay-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name event.siping.me;
    ssl_certificate /etc/letsencrypt/live/event.siping.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/event.siping.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    location /realtime/ {
        if ($cookie_eventplay_preview != "__ACCESS_COOKIE__") { return 403; }
        proxy_pass http://127.0.0.1:8002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location / {
        auth_basic "EventPlay private preview";
        auth_basic_user_file /etc/nginx/eventplay.htpasswd;
        add_header Set-Cookie "eventplay_preview=__ACCESS_COOKIE__; Path=/; Secure; HttpOnly; SameSite=Strict";
        proxy_pass http://127.0.0.1:4181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
